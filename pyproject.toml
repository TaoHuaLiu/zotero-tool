[project]
name = "zotero-tool"
version = "0.1.0"
description = "Command-line CRUD for Zotero group (shared) libraries"
readme = "README.md"
authors = [
    { name = "Hugo", email = "60650748+TaoHuaLiu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyzotero>=1.17.0",
    "typer>=0.29.2",
]

[project.scripts]
zotero-tool = "zotero_tool:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B006", "B008"]  # typer declares list options with [] defaults
